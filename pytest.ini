[pytest]
# 测试全部放在 tests/ 下；sys.path 的注入点在 tests/conftest.py
testpaths = tests

# 默认显示跳过/失败原因；hardware 标记默认不跑（需要真实 GPIO）。
# 注意：不要把 -q 写进 addopts —— 否则命令行再给一个 -q 会变成 -qq，
# 连最后的 "N passed" 汇总行都会被抑制。
addopts = -ra -m "not hardware"

markers =
    hardware: 需要真实 GPIO / 物理硬件的测试（默认通过 -m "not hardware" 跳过）
    slow: 运行时间较长的测试

filterwarnings =
    # 库在纯逻辑测试里会打告警日志，不视为失败
    default
